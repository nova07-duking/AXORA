services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: axora
      POSTGRES_USER: axora
      POSTGRES_PASSWORD: ${AXORA_POSTGRES_PASSWORD:?Set AXORA_POSTGRES_PASSWORD in .env.postgres}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - axora_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U axora -d axora"]
      interval: 5s
      timeout: 5s
      retries: 12
volumes:
  axora_postgres:
